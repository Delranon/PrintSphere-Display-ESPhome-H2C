substitutions:
  homeassistant_url: #Enter your HA adress: http://homeassistant.local:8123 or https://homeassistant.local:8443
  bambulab_printer: #Enter your printer entity name from homeassistant
  bambulab_serial: #Enter your printer serial from homeassistant if you didnt rename the AMS in Home Assistant
  bambulab_icon: #custom icon on page one: images/bambuicon.png

esphome:
  name: round-esp32
  friendly_name: PrintSphere-Display
  min_version: 2025.9.0
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

api:
  encryption:
    key: !secret api_encrypt

ota:
  - platform: esphome
    password: !secret ota_password

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  reboot_timeout: 10min

globals:
  - id: ui_built
    type: bool
    restore_value: no
    initial_value: "false"
  - id: ui_col_now
    type: uint32_t
    restore_value: no
    initial_value: "0x00FF00"
  - id: ui_col_target
    type: uint32_t
    restore_value: no
    initial_value: "0x00FF00"
  - id: last_prog
    type: int
    restore_value: no
    initial_value: "0"
  - id: print_active
    type: bool
    restore_value: no
    initial_value: "false"
  - id: is_scrolling
    type: bool
    restore_value: no
    initial_value: "false"

time:
  - platform: homeassistant
    id: esptime

http_request:
  id: httpc
  timeout: 10s
  verify_ssl: false

image:
  - file: ${bambulab_icon}
    id: img_bambu_logo
    type: RGB565
  - file: images/bambuicon.png  # neutraler Platzhalter (z.B. schwarz/transparent)
    id: img_placeholder
    type: RGB565
# ---------- QSPI ----------
spi:
  - id: qspi_bus
    type: quad
    interface: spi3
    clk_pin: GPIO10
    data_pins: [GPIO11, GPIO12, GPIO13, GPIO14]

# --- I²C (Touch) ---
i2c:
  - id: touch_i2c
    sda: GPIO47
    scl: GPIO48
    scan: true
    frequency: 400kHz

touchscreen:
  - platform: ft63x6
    id: touch
    i2c_id: touch_i2c
    address: 0x38
    update_interval: 30ms
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: true

# ---------- Display ----------
display:
  - platform: mipi_spi
    model: CO5300
    id: my_display
    bus_mode: quad
    cs_pin: GPIO9
    reset_pin: GPIO21
    brightness: 248
    #transform:
    #  swap_xy: true
    #  mirror_x: true
    #  mirror_y: true
    dimensions:
      height: 466
      width: 466
      offset_width: 6
    data_rate: 80000000
    spi_mode: MODE0
    rotation: 180 # 270 when transform (90° rotation towards USB port)
    invert_colors: false

# ---------- HA-Entities ----------
sensor:
  - platform: homeassistant
    id: print_progress
    entity_id: sensor.${bambulab_printer}_print_progress
    internal: true
  - platform: homeassistant
    id: nozzle_temp
    entity_id: sensor.${bambulab_printer}_nozzle_temperature
    internal: true
  - platform: homeassistant
    id: nozzle_temp_l
    entity_id: sensor.${bambulab_printer}_left_nozzle_temperature
    internal: true
  - platform: homeassistant
    id: bed_temp
    entity_id: sensor.${bambulab_printer}_bed_temperature
    internal: true
  - platform: homeassistant
    id: chamber_temp
    entity_id: sensor.${bambulab_printer}_chamber_temperature
    internal: true
  - platform: homeassistant
    id: remaining_time
    entity_id: sensor.${bambulab_printer}_remaining_time
    internal: true
  - platform: homeassistant
    id: current_layer
    entity_id: sensor.${bambulab_printer}_current_layer
    internal: true
  - platform: homeassistant
    id: total_layer
    entity_id: sensor.${bambulab_printer}_total_layer_count
    internal: true

online_image:
  - id: ha_preview
    # Start-URL ist egal – wir überschreiben sie gleich via set_url
    url: "${homeassistant_url}/api/image_proxy/image.${bambulab_printer}_cover_image"
    format: PNG
    type: RGB565
    resize: 420x420
    placeholder: img_placeholder
    request_headers:
      Accept: image/png,image/jpeg;q=0.9,*/*;q=0.1
      Accept-Encoding: identity
    on_download_finished:
      then:
        - lvgl.image.update:
            id: img_preview
            src: ha_preview
        - delay: 50ms
        - lambda: |-
            using namespace esphome::lvgl;
            // Scroll/Touch sicher aus
            lv_obj_set_scrollbar_mode(id(img_mask), LV_SCROLLBAR_MODE_OFF);
            lv_obj_clear_flag(id(img_mask), LV_OBJ_FLAG_SCROLLABLE | LV_OBJ_FLAG_CLICKABLE);
            lv_obj_clear_flag(id(img_preview), LV_OBJ_FLAG_SCROLLABLE | LV_OBJ_FLAG_CLICKABLE);
            // Optional: Hinweis ausblenden, sobald ein Bild da ist
            lv_obj_add_flag(id(page2_note), LV_OBJ_FLAG_HIDDEN);
            // Zoom zurücksetzen, dann Größe lesen
            lv_img_set_zoom(id(img_preview), 256);  // 256 = 1.0x
            int w = lv_obj_get_width(id(img_preview));
            int h = lv_obj_get_height(id(img_preview));
            // "cover" auf 420er Kreis
            if (w > 0 && h > 0) {
              const int D = 420;
              int z_w = (D * 256 + w - 1) / w;   // ceil(D/w)
              int z_h = (D * 256 + h - 1) / h;   // ceil(D/h)
              int z   = (z_w > z_h) ? z_w : z_h; // COVER
              if (z < 16)   z = 16;
              if (z > 1024) z = 1024;
              lv_img_set_zoom(id(img_preview), z);
            }
            lv_obj_center(id(img_preview));
            lv_obj_invalidate(id(img_preview));

